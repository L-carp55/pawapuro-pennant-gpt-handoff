name: Apply baserunning gate after rebuild
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths:
      - .github/workflows/apply-baserunning-gate-after-rebuild.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .chatgpt/patch_baserunning_gate_after_rebuild.py
      - name: Validate JSON and safety tests
        run: |
          python -m json.tool configs/model_gates.json >/dev/null
          node scripts/test_running_gates.mjs
          node scripts/test_cards.mjs
          node scripts/test_phase1_safety.mjs
      - name: Commit verified gate update
        run: |
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add configs/model_gates.json
          git commit -m "audit: keep baserunning paused after speed-separated reliability test"
          git push origin HEAD:agent/satei-phase1-safety
