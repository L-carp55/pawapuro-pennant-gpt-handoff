name: speed-construct-complete-build

on:
  push:
    paths:
      - 'scripts/build_sp077_construct_complete_owner_review_queue_20260817.mjs'
      - 'scripts/audit_sp021_anchor_bank_20260817.mjs'
      - 'scripts/augment_sp077_with_sp021_anchors_20260817.mjs'
      - 'scripts/qa_sp077_construct_complete_owner_review_queue_20260817.mjs'
      - 'data/normalized/speed_historical_physical_measurements_2015_2026.json'
      - '.github/workflows/speed-construct-complete-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-construct-complete-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit SP-021 historical anchor bank
        run: node scripts/audit_sp021_anchor_bank_20260817.mjs
      - name: Generate construct-complete queue
        run: node scripts/build_sp077_construct_complete_owner_review_queue_20260817.mjs
      - name: Surface SP-021 high-confidence anchors
        run: node scripts/augment_sp077_with_sp021_anchors_20260817.mjs
      - name: Independent construct-complete queue QA
        run: node scripts/qa_sp077_construct_complete_owner_review_queue_20260817.mjs
      - name: Verify generated artifacts exist
        run: |
          test -s outputs/derived/sp021_anchor_bank_inventory_20260817.json
          test -s outputs/derived/sp077_construct_complete_owner_review_queue_20260817.json
          test -s outputs/derived/qa_sp077_construct_complete_owner_review_queue_20260817.json
          test -s docs/reports/sp077_construct_complete_owner_review_queue_20260817.md
          test -s docs/audits/sp077_construct_complete_owner_review_independent_qa_20260817.md
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/derived/sp021_anchor_bank_inventory_20260817.json outputs/derived/sp077_construct_complete_owner_review_queue_20260817.json outputs/derived/qa_sp077_construct_complete_owner_review_queue_20260817.json docs/reports/sp077_construct_complete_owner_review_queue_20260817.md docs/audits/sp077_construct_complete_owner_review_independent_qa_20260817.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'build(speed): generate and independently verify construct-complete owner review queue'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
