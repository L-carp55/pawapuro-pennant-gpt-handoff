name: Audit baserunning source

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/audit-baserunning-labels.yml
      - scripts/audit_baserunning_event_labels.mjs
      - scripts/audit_advance_speed_impact.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit saved baserunning labels
        run: node scripts/audit_baserunning_event_labels.mjs
      - name: Measure stale advancement impact on speed
        run: node scripts/audit_advance_speed_impact.mjs
