name: Cleanup provisional card outputs
on:
  push:
    branches: [agent/satei-phase1-clean]
    paths:
      - .github/workflows/cleanup-provisional-card-outputs.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-clean
          fetch-depth: 0
      - name: Restore or remove generated cards
        run: |
          git fetch origin main
          for p in \
            outputs/cards/村上宗隆_2024.json \
            outputs/cards/山川穂高_2024.json \
            outputs/cards/周東佑京_2024.json \
            outputs/cards/近本光司_2024.json \
            outputs/cards/源田壮亮_2024.json \
            outputs/cards/甲斐拓也_2024.json \
            outputs/cards/岡本和真_2024.json \
            outputs/cards/牧秀悟_2024.json; do
            if git cat-file -e "origin/main:$p" 2>/dev/null; then
              git checkout origin/main -- "$p"
            else
              rm -f "$p"
            fi
          done
          rm -f .github/workflows/cleanup-provisional-card-outputs.yml
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add -A
          git commit -m "chore: keep provisional sample out of card outputs"
          git push origin HEAD:agent/satei-phase1-clean
