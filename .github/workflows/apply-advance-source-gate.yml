name: Apply advancement source gate

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/apply-advance-source-gate.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {n}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'src/cards/durable_estimate.mjs',
              '  const { runNorm, fldNorm } = ctx;\n',
              '  const { runNorm, fldNorm, modelGates = {} } = ctx;\n'
              '  const advanceEnabled = modelGates?.baserunning_advance_source?.enabled !== false;\n',
          )
          replace_once(
              'src/cards/durable_estimate.mjs',
              '    const adv = advanceOf(db, nrm(r.name), r.season);\n',
              '    const adv = advanceEnabled ? advanceOf(db, nrm(r.name), r.season) : null;\n',
          )
          replace_once(
              'src/cards/pipeline.mjs',
              '  const durable = estimateDurableTraits(db, p.player_id, targetSeason, { cfg, runNorm, fldNorm, lgOf, envFactorsOf });\n',
              '  const durable = estimateDurableTraits(db, p.player_id, targetSeason,\n'
              '    { cfg, runNorm, fldNorm, lgOf, envFactorsOf, modelGates: ctx.modelGates });\n',
          )
          replace_once(
              'src/cards/pipeline.mjs',
              '    const adv = advanceOf(db, normName(p.name), targetSeason);\n',
              '    const advanceGate = ctx.modelGates?.baserunning_advance_source;\n'
              '    const adv = advanceGate?.enabled === false\n'
              '      ? null : advanceOf(db, normName(p.name), targetSeason);\n',
          )
          replace_once(
              'src/cards/pipeline.mjs',
              '      baserunningStatus: baserunningGate?.enabled === false ? baserunningGate : null,\n',
              '      baserunningStatus: baserunningGate?.enabled === false ? baserunningGate : null,\n'
              '      advanceSourceStatus: advanceGate?.enabled === false ? advanceGate : null,\n',
          )

          Path('scripts/test_baserunning_gate.mjs').write_text('''// 走塁得能と追加進塁ソースの安全停止が黙って解除されないための回帰テスト。DB不要。\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst ROOT = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');\nconst gate = JSON.parse(await readFile(path.join(ROOT, 'configs', 'model_gates.json'), 'utf8'));\nassert.equal(gate.baserunning_advance_source.enabled, false);\nassert.equal(gate.baserunning_advance_source.status, 'STALE_REBUILD_REQUIRED');\nassert.ok(gate.baserunning_advance_source.evidence.outcome_label_contradiction_rate > 0.08);\nassert.equal(gate.baserunning_advance_source.evidence.first_to_third_explicit_start_checked, 126);\nassert.equal(gate.baserunning_advance_source.evidence.first_to_third_explicit_start_mismatches, 126);\nassert.ok(gate.baserunning_advance_source.reopen_conditions.length >= 4);\nassert.equal(gate.baserunning_ability.enabled, false);\nassert.equal(gate.baserunning_ability.status, 'PAUSED');\nassert.match(gate.baserunning_ability.reason, /循環/);\nassert.ok(gate.baserunning_ability.evidence.combined_repeatability < 0.3);\nassert.ok(gate.baserunning_ability.reopen_conditions.length >= 4);\n\nconst pipeline = await readFile(path.join(ROOT, 'src', 'cards', 'pipeline.mjs'), 'utf8');\nassert.match(pipeline, /modelGates/);\nassert.match(pipeline, /baserunningGate\\?\\.enabled === false \\? null/);\nassert.match(pipeline, /baserunningStatus/);\nassert.match(pipeline, /baserunning_advance_source/);\nassert.match(pipeline, /advanceGate\\?\\.enabled === false/);\nassert.match(pipeline, /advanceSourceStatus/);\nassert.match(pipeline, /unappraisedReasons/);\n\nconst durable = await readFile(path.join(ROOT, 'src', 'cards', 'durable_estimate.mjs'), 'utf8');\nassert.match(durable, /baserunning_advance_source/);\nassert.match(durable, /advanceEnabled \\? advanceOf/);\n\nconsole.log('baserunning gate: 20 checks passed');\n''')
          PY
      - name: Run regression tests
        run: |
          node scripts/test_baserunning_gate.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_phase1_safety.mjs
          node scripts/test_cards.mjs
          node scripts/test_qa_remaining.mjs
          node scripts/validate.mjs
          node scripts/build_card.mjs 周東 2024
      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .chatgpt/advance_source_gate.patch .github/workflows/apply-advance-source-gate.yml
          git add src/cards/durable_estimate.mjs src/cards/pipeline.mjs scripts/test_baserunning_gate.mjs
          git commit -m "fix: remove stale advancement metric from speed"
          git push origin HEAD:agent/satei-phase1-safety
