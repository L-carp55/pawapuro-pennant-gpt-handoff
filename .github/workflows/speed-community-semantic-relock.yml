name: speed-community-semantic-relock

on:
  push:
    branches:
      - review/opus-speed-pre-owner-review-wave-20260816
    paths:
      - '.github/workflows/speed-community-semantic-relock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/opus-speed-pre-owner-review-wave-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reopen SP-077 and SP-078 under semantic integrity lock
        run: node scripts/relock_speed_registry_on_community_semantic_defect_20260817.mjs
      - name: Registry QA in locked state
        run: node scripts/qa_speed_task_registry.mjs
      - name: Verify locked verdict write is rejected
        run: node scripts/qa_sp078_integrity_lock_20260817.mjs
      - name: Commit relocked registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/state/speed_task_registry.tsv
          git commit -m 'fix(speed): reopen owner review for Community semantic repair'
          git push origin HEAD:review/opus-speed-pre-owner-review-wave-20260816
