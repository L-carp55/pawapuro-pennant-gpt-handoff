name: Apply minimal safety follow-up
on:
  push:
    branches: [agent/satei-phase1-clean]
    paths:
      - .github/workflows/apply-minimal-safety-followup.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch archive branch
        run: git fetch origin agent/satei-phase1-safety:refs/remotes/origin/agent/satei-phase1-safety
      - name: Apply minimal safety patch
        run: python .chatgpt/apply_minimal_safety_followup.py
      - name: Syntax and focused tests
        run: |
          node --check src/cards/pipeline.mjs
          node --check src/cards/ability_sheet.mjs
          node --check src/ratings/direct_measurement.mjs
          node --check src/ratings/scouting_input.mjs
          node scripts/test_phase1_safety.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_cards.mjs
      - name: Build 2024 provisional sample
        run: |
          for n in 村上 山川 周東 近本 源田 甲斐拓也 岡本 牧; do
            node scripts/build_card.mjs "$n" 2024
          done
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          const wanted=['村上','山川','周東','近本','源田','甲斐拓也','岡本','牧'];
          const files=readdirSync('outputs/cards').filter(f=>f.endsWith('_2024.json'));
          const cards=[];
          for(const key of wanted){
            const hit=files.find(f=>f.startsWith(key));
            if(!hit) throw new Error(`sample card missing: ${key}`);
            cards.push(JSON.parse(readFileSync(`outputs/cards/${hit}`,'utf8')));
          }
          const val=v=>v?.value ?? null;
          const fmt=v=>v==null?'—':String(v);
          const lines=[
            '# 2024 第1回仮査定（安全ゲート反映後）','',
            '年度は全員2024明示指定。走力・守備力・直接根拠のない内野肩は未査定、捕球は暫定。','',
            '| 選手 | 弾道 | ミート | パワー | 走力 | 肩力 | 守備力 | 捕球 |',
            '|---|---:|---:|---:|---:|---:|---:|---:|'
          ];
          for(const c of cards){
            const b=c.abilities?.基礎能力 ?? {};
            lines.push(`| ${c.name_ja} | ${fmt(val(b.弾道))} | ${fmt(val(b.ミート))} | ${fmt(val(b.パワー))} | ${fmt(val(b.走力))} | ${fmt(val(b.肩力))} | ${fmt(val(b.守備力))} | ${fmt(val(b.捕球))}${b.捕球?.provisional?' 暫':''} |`);
          }
          lines.push('','## 未査定理由','');
          for(const c of cards) lines.push(`- **${c.name_ja}**: ${(c.abilities?.未査定 ?? []).join(' / ') || 'なし'}`);
          mkdirSync('docs/audits',{recursive:true});
          writeFileSync('docs/audits/2026-08-08_provisional_sample_2024.md',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE
      - name: Commit verified result and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-minimal-safety-followup.yml .chatgpt/apply_minimal_safety_followup.py
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add -A
          git commit -m "safety: restore minimal as-of and invalid-model gates"
          git push origin HEAD:agent/satei-phase1-clean
