name: Apply scouting evidence semantics

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/apply-scouting-semantics.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded edits
        run: |
          python3 .chatgpt/apply_scouting_semantics.py
          node --check src/ratings/scouting_input.mjs
          node --check src/ratings/speed_evidence.mjs
          node --check src/ratings/ability_evidence.mjs
          node --check src/cards/pipeline.mjs
      - name: Run scouting and speed tests
        run: |
          node scripts/test_scouting_application.mjs
          node scripts/test_scouting_evidence_only_integration.mjs
          node scripts/test_speed_evidence.mjs
          node scripts/test_direct_measurement_temporal.mjs
          node scripts/test_speed_external_integration.mjs
          node scripts/test_speed_override_population.mjs
      - name: Run full regression tests
        run: |
          node scripts/test_asof_evidence.mjs
          node scripts/test_baserunning_gate.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_cards.mjs
          node scripts/test_ability_sheet.mjs
          node scripts/test_ledger_regressions.mjs
          node scripts/test_interactions.mjs
          node scripts/test_fielding_regressions.mjs
          node scripts/test_qa_remaining.mjs
          node scripts/validate.mjs
      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .chatgpt/apply_scouting_semantics.py .github/workflows/apply-scouting-semantics.yml
          git add src/ratings/scouting_input.mjs src/ratings/speed_evidence.mjs src/ratings/ability_evidence.mjs src/cards/pipeline.mjs
          git commit -m "fix: separate scouting evidence from final decisions"
          git push origin HEAD:agent/satei-phase1-safety
