name: speed-owner-review-unlock-transition

on:
  push:
    branches:
      - review/opus-speed-pre-owner-review-wave-20260816
    paths:
      - '.github/workflows/speed-owner-review-unlock-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-owner-review-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/opus-speed-pre-owner-review-wave-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fail-closed transition
        run: node scripts/finalize_speed_owner_review_rebind_20260817.mjs
      - name: Show transition diff
        run: git diff --check && git diff -- docs/state/speed_task_registry.tsv docs/state/speed_owner_review_integrity_lock_20260817.json outputs/derived/sp078_owner_verdict_ledger_20260816.json docs/audits/speed_owner_review_unlock_transition_20260817.md
      - name: Commit transition only after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/state/speed_task_registry.tsv docs/state/speed_owner_review_integrity_lock_20260817.json outputs/derived/sp078_owner_verdict_ledger_20260816.json docs/audits/speed_owner_review_unlock_transition_20260817.md
          if git diff --cached --quiet; then
            echo 'No transition changes to commit'
            exit 1
          fi
          git commit -m 'fix(speed): revalidate owner review and rebind empty verdict ledger'
          git push origin HEAD:review/opus-speed-pre-owner-review-wave-20260816
