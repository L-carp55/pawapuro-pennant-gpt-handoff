name: Apply engine config loader
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/apply-engine-config-loader.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply loader patch
        run: python .chatgpt/patch_engine_config_loader.py
      - name: Syntax
        run: |
          node --check src/engine/config.mjs
          node --check scripts/run_pennant.mjs
          node --check scripts/run_identity_test.mjs
          node --check scripts/run_season_test.mjs
          node --check scripts/test_engine_config_loader.mjs
      - name: Config loader
        run: node scripts/test_engine_config_loader.mjs
      - name: Runner state
        run: node scripts/test_engine_runner_state.mjs
      - name: Running events
        run: node scripts/test_running_event_response.mjs
      - name: Identity season
        run: node scripts/run_identity_test.mjs 2024 20260731
      - name: Season engine
        run: node scripts/run_season_test.mjs 2024 20260731
      - name: Commit verified loader wiring
        run: |
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add scripts/run_pennant.mjs scripts/run_identity_test.mjs scripts/run_season_test.mjs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "engine: hydrate running responses in simulation entrypoints"
            git push origin HEAD:agent/satei-phase1-safety
          fi
