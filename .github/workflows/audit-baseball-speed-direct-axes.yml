name: Audit baseball speed direct axes
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-baseball-speed-direct-axes.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit_baseball_speed_direct_axes.mjs
      - run: node scripts/audit_baseball_speed_direct_axes.mjs
