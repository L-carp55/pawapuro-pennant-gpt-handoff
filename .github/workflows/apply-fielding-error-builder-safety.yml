# validate current builder; no DB or source write-back
name: Validate fielding error builder safety
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths:
      - .github/workflows/apply-fielding-error-builder-safety.yml
      - scripts/build_fielding_error_events.mjs
      - src/ratings/fielding_workload.mjs
      - scripts/test_fielding_workload.mjs
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and workload tests
        run: |
          node --check scripts/build_fielding_error_events.mjs
          node --check src/ratings/fielding_workload.mjs
          node scripts/test_fielding_workload.mjs
      - name: Fetch 2024 raw PBP
        run: node scripts/fetch_npb_pbp_release.mjs 2024 /tmp/pbp2024
      - name: Non-destructive 2024 dry run
        env:
          PBP_RAW_DIR: /tmp/pbp2024
          PBP_DRY_RUN: '1'
        run: node scripts/build_fielding_error_events.mjs | tee /tmp/fielding2024.txt
      - name: Acceptance sanity
        run: |
          grep -q 'fielding_error_events' /tmp/fielding2024.txt
          grep -q 'FE ' /tmp/fielding2024.txt
          grep -q '負荷contextあり' /tmp/fielding2024.txt
          grep -q 'mode DRY_RUN' /tmp/fielding2024.txt
