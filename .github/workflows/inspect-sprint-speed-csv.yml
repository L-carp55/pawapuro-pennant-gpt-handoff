name: Inspect sprint speed CSV
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/inspect-sprint-speed-csv.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fLsS 'https://baseballsavant.mlb.com/sprint_speed_leaderboard?year=2025&position=&team=&min=5&csv=true' -o /tmp/sprint.csv
          wc -l /tmp/sprint.csv
          head -3 /tmp/sprint.csv
