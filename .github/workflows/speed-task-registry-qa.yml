name: speed-task-registry-qa
# 2026-08-17 explicit post-unlock remote verification trigger: run canonical registry/construct/ledger gates on the committed transition state.

on:
  push:
    paths:
      - 'CLAUDE.md'
      - 'docs/satei_handoff/**'
      - 'docs/state/**'
      - 'docs/tasks/**'
      - 'docs/audits/**'
      - 'outputs/derived/**'
      - 'scripts/qa_speed_task_registry.mjs'
      - 'scripts/qa_speed_construct_traceability_20260817.mjs'
      - 'scripts/qa_sp078_integrity_lock_20260817.mjs'
      - 'scripts/sp078_owner_verdict_capture_20260816.mjs'
      - '.github/workflows/speed-task-registry-qa.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'docs/satei_handoff/**'
      - 'docs/state/**'
      - 'docs/tasks/**'
      - 'docs/audits/**'
      - 'outputs/derived/**'
      - 'scripts/qa_speed_task_registry.mjs'
      - 'scripts/qa_speed_construct_traceability_20260817.mjs'
      - 'scripts/qa_sp078_integrity_lock_20260817.mjs'
      - 'scripts/sp078_owner_verdict_capture_20260816.mjs'
      - '.github/workflows/speed-task-registry-qa.yml'
  workflow_dispatch:

jobs:
  verify-speed-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate speed requirements and task registry
        run: node scripts/qa_speed_task_registry.mjs
      - name: Validate full speed construct reaches owner review
        run: node scripts/qa_speed_construct_traceability_20260817.mjs
      - name: Prove locked owner-verdict writes are rejected without mutation
        run: node scripts/qa_sp078_integrity_lock_20260817.mjs
