name: Apply common-scale speed evidence integration

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/apply-speed-external-integration.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded edits
        run: |
          python3 .chatgpt/apply_speed_external_integration.py
          python3 .chatgpt/apply_speed_log.py
          node --check src/cards/pipeline.mjs
          node --check src/cards/card_schema.mjs
      - name: Run speed consistency tests
        run: |
          node scripts/test_speed_evidence.mjs
          node scripts/test_direct_measurement_temporal.mjs
          node scripts/test_speed_external_integration.mjs
          node scripts/test_speed_override_population.mjs
          node scripts/audit_speed_override_scale.mjs 2024
      - name: Run full regression tests
        run: |
          node scripts/test_baserunning_events.mjs
          node scripts/test_baserunning_gate.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_phase1_safety.mjs
          node scripts/test_cards.mjs
          node scripts/test_ability_sheet.mjs
          node scripts/test_ledger_regressions.mjs
          node scripts/test_interactions.mjs
          node scripts/test_fielding_regressions.mjs
          node scripts/test_qa_remaining.mjs
          node scripts/validate.mjs
      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .chatgpt/apply_speed_external_integration.py .chatgpt/apply_speed_log.py
          git rm .github/workflows/apply-speed-external-integration.yml .github/workflows/audit-speed-override.yml
          git add src/cards/pipeline.mjs src/cards/card_schema.mjs
          git commit -m "fix: reconcile external speed on one scale"
          git push origin HEAD:agent/satei-phase1-safety
