name: Test physical running response
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/test-running-response.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check src/engine/running_response.mjs
          node --check scripts/test_running_response.mjs
      - run: node scripts/test_running_response.mjs
      - run: node scripts/test_speed_skill_factor.mjs
      - run: node scripts/test_cards.mjs
      - run: node scripts/test_qa_remaining.mjs
      - run: node scripts/test_phase1_safety.mjs
