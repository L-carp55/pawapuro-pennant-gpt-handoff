name: Apply as-of player evidence rules

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/apply-asof-evidence.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded edits
        run: |
          python3 .chatgpt/apply_asof_evidence.py
          python3 .chatgpt/update_asof_qa.py
          node --check src/cards/pipeline.mjs
      - name: Run as-of and regression tests
        run: |
          node scripts/test_asof_evidence.mjs
          node scripts/test_direct_measurement_temporal.mjs
          node scripts/test_speed_external_integration.mjs
          node scripts/test_speed_override_population.mjs
          node scripts/test_baserunning_gate.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_cards.mjs
          node scripts/test_ability_sheet.mjs
          node scripts/test_ledger_regressions.mjs
          node scripts/test_fielding_regressions.mjs
          node scripts/test_qa_remaining.mjs
          node scripts/validate.mjs
      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .chatgpt/apply_asof_evidence.py .chatgpt/update_asof_qa.py .github/workflows/apply-asof-evidence.yml
          git add src/cards/pipeline.mjs scripts/test_qa_remaining.mjs
          git commit -m "fix: enforce as-of player evidence cutoffs"
          git push origin HEAD:agent/satei-phase1-safety
