name: Audit running response from physical axes
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-running-response-physical-axes.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit_running_response_from_physical_axes.mjs
      - run: node scripts/audit_running_response_from_physical_axes.mjs
