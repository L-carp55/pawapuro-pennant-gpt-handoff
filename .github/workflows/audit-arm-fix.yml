name: Audit corrected infield arm proxy
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-arm-fix.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit_infield_arm_deep_throws.mjs
