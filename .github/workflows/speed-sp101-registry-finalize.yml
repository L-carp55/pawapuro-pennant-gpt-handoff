name: speed-sp101-registry-finalize

on:
  push:
    branches:
      - review/opus-speed-pre-owner-review-wave-20260816
    paths:
      - 'scripts/finalize_sp101_registry_activation_20260818.mjs'
      - '.github/workflows/speed-sp101-registry-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/opus-speed-pre-owner-review-wave-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze append-only owner ledger
        run: sha256sum outputs/derived/sp078_owner_verdict_ledger_20260816.json > /tmp/sp078.before.sha256
      - name: Finalize canonical SP-101 registry state
        run: node scripts/finalize_sp101_registry_activation_20260818.mjs
      - name: Verify registry and preserved speed state
        run: |
          sha256sum --check /tmp/sp078.before.sha256
          node scripts/qa_speed_task_registry.mjs
          node scripts/qa_speed_construct_traceability_20260817.mjs
          node scripts/qa_sp078_integrity_lock_20260817.mjs
          node - <<'NODE'
          const fs=require('fs');
          const lines=fs.readFileSync('docs/state/speed_task_registry.tsv','utf8').replace(/^\uFEFF/,'').trimEnd().split(/\r?\n/).map(x=>x.split('\t'));
          const head=lines[0];
          const rows=lines.slice(1).map(c=>Object.fromEntries(head.map((h,i)=>[h,c[i]])));
          const sp101=rows.filter(r=>r.task_id==='SP-101');
          const sp079=rows.find(r=>r.task_id==='SP-079');
          const lock=JSON.parse(fs.readFileSync('docs/state/speed_owner_review_integrity_lock_20260817.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('outputs/derived/sp078_owner_verdict_ledger_20260816.json','utf8'));
          if(sp101.length!==1||sp101[0].status!=='PARTIAL'||sp101[0].owner_review_block!=='1'||sp101[0].gate_block!=='1') throw new Error('SP-101 canonical row invalid');
          if(!sp079||sp079.status!=='BLOCKED_DEPENDENCY'||sp079.owner_review_block!=='1'||sp079.gate_block!=='1'||!sp079.depends_on.split(/[,;]/).includes('SP-101')) throw new Error('SP-079 canonical dependency invalid');
          if(lock.locked!==true||lock.reason_code!=='THE_SHOW_ELIGIBLE_UNIVERSE_UNDERCOUNT_AND_EVIDENCE_UTILIZATION_INCOMPLETE') throw new Error('owner review lock invalid');
          if(ledger.owner_verdict_count!==0||ledger.records?.length!==0) throw new Error('owner ledger mutated');
          console.log(JSON.stringify({status:'PASS',sp101:sp101[0].status,sp079:sp079.status,locked:lock.locked,ledger:ledger.owner_verdict_count}));
          NODE
      - name: Commit registry repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/state/speed_task_registry.tsv
          if git diff --cached --quiet; then
            echo 'Registry already aligned.'
            exit 0
          fi
          git commit -m 'fix(speed): bind SP-079 to expanded The Show scope rebuild'
          git pull --rebase origin review/opus-speed-pre-owner-review-wave-20260816
          git push origin HEAD:review/opus-speed-pre-owner-review-wave-20260816
