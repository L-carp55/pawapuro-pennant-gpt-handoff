# audit-current-speed-scale
name: Current 2024 appraisal sample

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/sample-2024-current.yml

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit current pipeline speed scale
        run: node scripts/audit_current_speed_scale.mjs
