name: Apply direct temporal gate

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/apply-direct-temporal-gate.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded edits
        run: |
          python3 .chatgpt/apply_direct_temporal_gate.py
          python3 .chatgpt/update_temporal_qa.py
      - name: Run regression tests
        run: |
          node scripts/test_direct_measurement_temporal.mjs
          node scripts/test_speed_evidence.mjs
          node scripts/test_baserunning_gate.mjs
          node scripts/test_speed_z_final.mjs
          node scripts/test_cards.mjs
          node scripts/test_qa_remaining.mjs
          node scripts/validate.mjs
      - name: Commit tested changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .chatgpt/apply_direct_temporal_gate.py .chatgpt/update_temporal_qa.py .github/workflows/apply-direct-temporal-gate.yml
          git add src/ratings/direct_measurement.mjs scripts/test_qa_remaining.mjs
          git commit -m "fix: block future direct measurements from past cards"
          git push origin HEAD:agent/satei-phase1-safety
