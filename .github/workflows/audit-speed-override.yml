name: Audit speed override scale

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/audit-speed-override.yml
      - scripts/audit_speed_override_scale.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit 2024 as-of cards
        run: node scripts/audit_speed_override_scale.mjs 2024
      - name: Audit 2026 measurement-year cards
        run: node scripts/audit_speed_override_scale.mjs 2026
