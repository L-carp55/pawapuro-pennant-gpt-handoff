name: Audit rebuilt baserunning 2024
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths:
      - .github/workflows/audit-rebuilt-baserunning-2024.yml
      - src/ratings/baserunning_events.mjs
      - scripts/test_baserunning_events.mjs
      - scripts/audit_pbp_baserunning_schema.mjs
      - scripts/audit_pbp_plate_appearance_keys.mjs
      - scripts/audit_pbp_pre_hit_base_state.mjs
      - scripts/audit_pbp_mismatch_plate_appearances.mjs
      - scripts/audit_baserunning_event_labels.mjs
      - scripts/build_baserunning_advances.mjs
      - scripts/fetch_npb_pbp_release.mjs
      - scripts/write_baserunning_rebuild_audit.mjs
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pure tests
        run: |
          node --check scripts/fetch_npb_pbp_release.mjs
          node --check scripts/audit_pbp_baserunning_schema.mjs
          node --check scripts/audit_pbp_plate_appearance_keys.mjs
          node --check scripts/audit_pbp_pre_hit_base_state.mjs
          node --check scripts/audit_pbp_mismatch_plate_appearances.mjs
          node --check scripts/audit_baserunning_event_labels.mjs
          node --check scripts/build_baserunning_advances.mjs
          node --check scripts/write_baserunning_rebuild_audit.mjs
          node scripts/test_baserunning_events.mjs
      - name: Fetch 2024 PBP release assets
        run: node scripts/fetch_npb_pbp_release.mjs 2024 /tmp/npb_pbp_2024
      - name: Diagnose release PBP schema/value semantics
        env:
          PBP_RAW_DIR: /tmp/npb_pbp_2024
        run: node scripts/audit_pbp_baserunning_schema.mjs
      - name: Audit plate-appearance keys
        env:
          PBP_RAW_DIR: /tmp/npb_pbp_2024
        run: node scripts/audit_pbp_plate_appearance_keys.mjs
      - name: Audit pre-hit base-state semantics
        env:
          PBP_RAW_DIR: /tmp/npb_pbp_2024
        run: node scripts/audit_pbp_pre_hit_base_state.mjs
      - name: Inspect residual mismatch plate appearances
        env:
          PBP_RAW_DIR: /tmp/npb_pbp_2024
        run: node scripts/audit_pbp_mismatch_plate_appearances.mjs
      - name: Write persistent rebuild audit from temporary DB
        env:
          PBP_RAW_DIR: /tmp/npb_pbp_2024
        run: node scripts/write_baserunning_rebuild_audit.mjs 2024 docs/audits/2026-08-07_baserunning_rebuild_2024.md
      - name: Commit audit report
        run: |
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add docs/audits/2026-08-07_baserunning_rebuild_2024.md
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "audit: persist 2024 baserunning rebuild validation"
            git push origin HEAD:agent/satei-phase1-safety
          fi
