name: Audit speed grounder round3
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-speed-grounder-round3.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit_speed_vs_npbplus.mjs
      - run: node scripts/audit_speed_vs_npbplus.mjs
