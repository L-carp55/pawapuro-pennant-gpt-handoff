name: Apply baseball speed separation
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/apply-baseball-speed-separation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .chatgpt/patch_baseball_speed_separation.py
      - name: Syntax
        run: |
          node --check src/cards/pipeline.mjs
          node --check scripts/test_qa_remaining.mjs
          node --check src/ratings/fielding_workload.mjs
          node --check scripts/build_fielding_error_events.mjs
      - name: Workload test
        run: node scripts/test_fielding_workload.mjs
      - name: Defense gates
        run: node scripts/test_defense_redesign_gates.mjs
      - name: Cards
        run: node scripts/test_cards.mjs
      - name: Existing QA
        run: node scripts/test_qa_remaining.mjs
      - name: Phase1 safety
        run: node scripts/test_phase1_safety.mjs
      - name: Commit verified patch
        run: |
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git add src/cards/pipeline.mjs scripts/test_qa_remaining.mjs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "safety: separate baseball speed from running skills"
            git push origin HEAD:agent/satei-phase1-safety
          fi
