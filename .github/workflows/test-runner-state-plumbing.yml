name: Test runner-state plumbing
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/test-runner-state-plumbing.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/engine/baserunning.mjs
          node --check src/engine/game.mjs
          node --check src/engine/runner_context.mjs
          node --check scripts/test_engine_runner_state.mjs
      - name: Runner state
        run: node scripts/test_engine_runner_state.mjs
      - name: Physical response
        run: node scripts/test_running_response.mjs
      - name: Engine identity
        run: node scripts/run_identity_test.mjs 2024 20260731
      - name: Season engine
        run: node scripts/run_season_test.mjs 2024 20260731
      - name: Cards
        run: node scripts/test_cards.mjs
      - name: QA
        run: node scripts/test_qa_remaining.mjs
      - name: Phase1 safety
        run: node scripts/test_phase1_safety.mjs
