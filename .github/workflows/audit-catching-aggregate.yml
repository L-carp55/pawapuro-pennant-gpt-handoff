name: Audit catching aggregate hypotheses
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-catching-aggregate.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit_catching_aggregate_hypotheses.mjs
      - run: node scripts/audit_catching_aggregate_hypotheses.mjs
