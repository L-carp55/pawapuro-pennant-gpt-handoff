name: Test fielding workload context
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/test-fielding-workload-context.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/ratings/fielding_workload.mjs
          node --check scripts/build_fielding_error_events.mjs
          node --check scripts/test_fielding_workload.mjs
      - name: Workload unit test
        run: node scripts/test_fielding_workload.mjs
      - name: Defense gates
        run: node scripts/test_defense_redesign_gates.mjs
      - name: Existing QA
        run: node scripts/test_qa_remaining.mjs
      - name: Phase1 safety
        run: node scripts/test_phase1_safety.mjs
