name: Audit joint speed skill factor
on:
  push:
    branches: [agent/satei-phase1-safety]
    paths: [.github/workflows/audit-joint-speed-skill-factor.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/audit_joint_speed_skill_factor.mjs
      - run: node scripts/audit_joint_speed_skill_factor.mjs
