name: Audit Tier A full 2024 v2
on:
  push:
    branches: [agent/satei-phase1-safety]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch 2024 PBP
        run: node scripts/fetch_npb_pbp.mjs 2024 02,03,04,05,06,07,08,09,10,11
      - name: Validate reconstructed splits
        run: |
          python - <<'PY'
          import csv, glob, re, sqlite3, collections, json
          REGULAR={'1','2','26','1.0','2.0','26.0'}
          def norm(s): return re.sub(r'[\s　]+','',str(s or ''))
          def num(v):
              try: return float(v)
              except: return None
          def filled(row,key): return row.get(key) not in (None,'','nan','None')
          def risp(row): return filled(row,'on_2b') or filled(row,'on_2b_name') or filled(row,'on_3b') or filled(row,'on_3b_name')
          HIT_RE=re.compile(r'内野安打|安打|ヒット|二塁打|ツーベース|三塁打|スリーベース|本塁打|ホームラン')
          NONAB_RE=re.compile(r'フォアボール|四球|敬遠|死球|デッドボール|犠牲フライ|犠飛|犠打|送りバント|犠牲バント|スクイズ|打撃妨害')
          pa={}
          for fn in sorted(glob.glob('data/raw/npb_pbp/2024-*_pbp.csv')):
              with open(fn,encoding='utf-8-sig',newline='') as f:
                  for row in csv.DictReader(f):
                      if str(row.get('game_type_id','')) not in REGULAR: continue
                      # 表裏を必ずキーに含める。inningだけでは同じ回の表裏が衝突する。
                      k=(row.get('game_id'),row.get('game_state_name'),row.get('inning_ab_num'))
                      o=pa.setdefault(k,{'first':None,'last':None,'term':None,'batter':None,'hands':set()})
                      if row.get('PlayInfo_PlayerName'): o['batter']=row['PlayInfo_PlayerName']
                      pn=num(row.get('pitch_number'))
                      if pn is not None and pn>0:
                          if o['first'] is None or pn < num(o['first'].get('pitch_number')): o['first']=row
                          if o['last'] is None or pn >= num(o['last'].get('pitch_number')): o['last']=row
                          h=(row.get('pitcher_hand') or '').strip().lower()
                          if h: o['hands'].add(h)
                      br=num(row.get('bresult'))
                      if br is not None and br>0: o['term']=row
          agg=collections.defaultdict(lambda: collections.Counter())
          skipped=collections.Counter(); hand_changed=0
          for o in pa.values():
              first,last,term=o['first'],o['last'],o['term']
              if first is None or last is None or term is None:
                  skipped['missing_pitch_or_terminal']+=1; continue
              batter=norm(o['batter'] or term.get('PlayInfo_PlayerName'))
              if not batter: skipped['missing_batter']+=1; continue
              desc=term.get('description_jap') or ''
              br=num(term.get('bresult'))
              if br is None or br<=0: skipped['no_result']+=1; continue
              nonab=bool(NONAB_RE.search(desc)); ab=0 if nonab else 1
              hit=1 if ab and HIT_RE.search(desc) else 0
              if len(o['hands'])>1: hand_changed+=1
              hand=(last.get('pitcher_hand') or term.get('pitcher_hand') or '').strip().lower()
              right=hand.startswith('right') or hand in ('r','右','1','1.0')
              r0,r1=risp(first),risp(last)
              a=agg[batter]; a['AB']+=ab; a['H']+=hit
              if right: a['R_AB']+=ab; a['R_H']+=hit
              if r0: a['RISP0_AB']+=ab; a['RISP0_H']+=hit
              if r1: a['RISP1_AB']+=ab; a['RISP1_H']+=hit
              if right and not r0: a['TIERA0_AB']+=ab; a['TIERA0_H']+=hit
              if right and not r1: a['TIERA1_AB']+=ab; a['TIERA1_H']+=hit
          db=sqlite3.connect('data/pennant.db')
          bat={norm(n):(int(round(ab or 0)),int(round(h or 0))) for n,ab,h in db.execute("select name,ab,h from v_batting where season=2024 and ab>=1")}
          split={(norm(n),lab):(int(round(ab or 0)),int(round(h or 0))) for n,lab,ab,h in db.execute("select name_norm,label,ab,h from nf3_split where season=2024 and label in ('対右投手','得点圏')")}
          right_ref={k[0]:v for k,v in split.items() if k[1]=='対右投手'}
          risp_ref={k[0]:v for k,v in split.items() if k[1]=='得点圏'}
          def compare(fab,fh,ref,minab):
              rows=[]
              for n,(ab,h) in ref.items():
                  if ab<minab or n not in agg: continue
                  rows.append((n,int(agg[n][fab]),int(agg[n][fh]),ab,h))
              return {
                'n':len(rows),
                'mae_ab':sum(abs(x[1]-x[3]) for x in rows)/len(rows),
                'mae_h':sum(abs(x[2]-x[4]) for x in rows)/len(rows),
                'exact_ab':sum(x[1]==x[3] for x in rows)/len(rows),
                'within2_ab':sum(abs(x[1]-x[3])<=2 for x in rows)/len(rows),
                'sum_pab':sum(x[1] for x in rows),'sum_rab':sum(x[3] for x in rows),
                'sum_ph':sum(x[2] for x in rows),'sum_rh':sum(x[4] for x in rows)
              }
          ts=compare('AB','H',bat,30); rs=compare('R_AB','R_H',right_ref,30)
          s0=compare('RISP0_AB','RISP0_H',risp_ref,20); s1=compare('RISP1_AB','RISP1_H',risp_ref,20)
          def show(s):
              return f"n={s['n']} MAE_AB={s['mae_ab']:.3f} MAE_H={s['mae_h']:.3f} exactAB={s['exact_ab']*100:.1f}% within2={s['within2_ab']*100:.1f}% sumAB={s['sum_pab']}/{s['sum_rab']} sumH={s['sum_ph']}/{s['sum_rh']}"
          chosen='start' if s0['mae_ab']+s0['mae_h'] <= s1['mae_ab']+s1['mae_h'] else 'terminal'
          print('FILES',len(glob.glob('data/raw/npb_pbp/2024-*_pbp.csv')),'PA_KEYS',len(pa),'HAND_CHANGED_PA',hand_changed)
          print('TOTAL',show(ts)); print('RIGHT',show(rs)); print('RISP_START',show(s0)); print('RISP_TERMINAL',show(s1)); print('CHOSEN_RISP_BASIS',chosen)
          targets=['村上宗隆','山川穂高','周東佑京','近本光司','源田壮亮','甲斐拓也','岡本和真','牧秀悟']
          for n in targets:
              a=agg[n]; ta_ab=a['TIERA0_AB'] if chosen=='start' else a['TIERA1_AB']; ta_h=a['TIERA0_H'] if chosen=='start' else a['TIERA1_H']
              print(json.dumps({'name':n,'pbp_total':[a['AB'],a['H']],'official_total':bat.get(n),'pbp_right':[a['R_AB'],a['R_H']],'nf3_right':right_ref.get(n),'pbp_risp_start':[a['RISP0_AB'],a['RISP0_H']],'pbp_risp_terminal':[a['RISP1_AB'],a['RISP1_H']],'nf3_risp':risp_ref.get(n),'tierA_right_nonrisp':[ta_ab,ta_h,ta_h/ta_ab if ta_ab else None]},ensure_ascii=False))
          print('SKIPPED',dict(skipped))
          PY
      - name: Clean temporary files
        run: |
          rm -rf data/raw/npb_pbp
          git config user.name "L-carp55"
          git config user.email "amilaleon1@gmail.com"
          git rm .github/workflows/audit-tier-a-full2024-v2.yml
          git commit -m "chore: remove corrected Tier A audit workflow"
          git push origin HEAD:agent/satei-phase1-safety
