name: Audit total peak components

on:
  push:
    branches:
      - agent/satei-phase1-safety
    paths:
      - .github/workflows/audit-peak-components.yml
      - scripts/audit_peak_components.mjs

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/satei-phase1-safety
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit_peak_components.mjs
